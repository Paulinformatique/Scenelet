<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scenelet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar + single content column (max 1180px); film page = backdrop band + poster / info / action panel */
:root{
  --bg:#f3eff6; --surface:#ffffff; --surface-2:#e9e3ef; --line:#d8cfe0;
  --fg:#221a2b; --muted:#6c6178; --accent:#0f8f7e; --accent-ink:#ffffff;
  --star:#d8902b; --heart:#d2456a; --scrim:rgba(20,12,28,.55);
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:6px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#18131f; --surface:#221b2c; --surface-2:#2c2338; --line:#3a2f48;
  --fg:#efe8f5; --muted:#a495b4; --accent:#3fd1b9; --accent-ink:#0f1a18;
  --star:#f0b04f; --heart:#ff6b8f; --scrim:rgba(8,4,12,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18131f; --surface:#221b2c; --surface-2:#2c2338; --line:#3a2f48;
  --fg:#efe8f5; --muted:#a495b4; --accent:#3fd1b9; --accent-ink:#0f1a18;
  --star:#f0b04f; --heart:#ff6b8f; --scrim:rgba(8,4,12,.7); color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--body)}
img{max-width:100%}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:0;z-index:20;background:var(--surface);background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;padding-block:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font:800 22px/1 var(--display);letter-spacing:-.02em}
.logo i{display:grid;grid-template-columns:repeat(3,6px);gap:2px}
.logo i b{width:6px;height:14px;border-radius:1px;background:var(--accent)}
.logo i b:nth-child(2){opacity:.6}.logo i b:nth-child(3){opacity:.3}
nav{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0}
nav a{padding:7px 11px;border-radius:var(--r);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
nav a:hover{color:var(--fg)} nav a.on{color:var(--fg);background:var(--surface-2)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:999px;padding:6px 14px;min-width:0}
.search input{border:0;background:none;color:var(--fg);font:inherit;width:170px;outline:none}
.who{display:flex;gap:8px;align-items:center}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--r);padding:9px 16px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:var(--heart);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--heart));color:#fff;font:700 13px/1 var(--display)}
@media (max-width:820px){.search{order:3;flex:1 1 100%}.search input{width:100%}nav{order:4;flex-basis:100%}}

main{padding-block:28px 64px;display:grid;gap:40px;min-height:60vh}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:clamp(28px,4.5vw,44px);font-weight:800;line-height:1.05}
h2{font-size:21px;font-weight:700;color:var(--fg);letter-spacing:-.01em}
.side h2,.film .sec h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}

/* home spotlight: featured backdrop, text sits on a fixed dark scrim so it reads in both themes */
.spot{position:relative;border-radius:14px;overflow:hidden;min-height:clamp(340px,40vw,480px);display:grid;align-content:end;
  background:linear-gradient(120deg,#2b1f3c,#0f8f7e) center/cover no-repeat;color:#fff;box-shadow:0 20px 50px -20px rgba(0,0,0,.45)}
.spot::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,9,20,.92) 0%,rgba(14,9,20,.65) 45%,rgba(14,9,20,.1) 100%),linear-gradient(0deg,rgba(14,9,20,.7),transparent 50%)}
.spot-in{position:relative;padding:clamp(22px,4vw,44px);display:grid;gap:12px;max-width:640px}
.spot .tag{color:#3fd1b9}
.spot h1{font-size:clamp(32px,5.4vw,60px);color:#fff}
.spot p{margin:0;color:rgba(255,255,255,.78);max-width:52ch;font-size:16px}
.spot-stats{display:flex;gap:18px;flex-wrap:wrap;color:rgba(255,255,255,.75)}
.spot-stats b{color:#fff;font:700 18px var(--display)}
.spot-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn.glass{background:rgba(255,255,255,.14);color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.btn.glass:hover{background:rgba(255,255,255,.24)}
.spot-feat{position:absolute;right:18px;top:16px;display:flex;gap:8px;align-items:baseline;background:rgba(14,9,20,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:7px 12px;border-radius:999px;font-size:13px;color:#fff;max-width:calc(100% - 36px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spot-feat:hover{background:rgba(14,9,20,.75)}
.genres{margin-top:-14px}
.genres .chip{padding:6px 14px}
.btn{transition:filter .15s,background .15s}
.btn:not(.ghost):not(.glass):hover{filter:brightness(1.08)}
.btn.ghost:hover{background:var(--line)}
/* ranked trending row */
.ranked{grid-auto-columns:minmax(170px,200px)}
.rk{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:end;min-width:0}
.rk .num{font:800 clamp(64px,7vw,96px)/.8 var(--display);color:transparent;-webkit-text-stroke:2px var(--line);margin-right:-10px;letter-spacing:-.06em;z-index:0}
.rk .card{z-index:1}
.sec{display:grid;gap:14px;min-width:0}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:2px;flex-wrap:wrap}
.link{color:var(--accent);font-weight:600;font-size:13px;background:none;border:0;padding:0}
.muted{color:var(--muted)} .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tag{font:500 11px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stars{color:var(--star);letter-spacing:1px;white-space:nowrap}
.heart{color:var(--heart)}

.hero{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:end}
.hero p{margin:10px 0 0;max-width:56ch;color:var(--muted)}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat b{display:block;font:700 30px/1 var(--display)}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
@media (max-width:760px){.hero{grid-template-columns:1fr}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(120px,150px);gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.card{display:grid;gap:6px;min-width:0;position:relative}
.poster{display:block;width:100%;aspect-ratio:2/3;max-width:100%;object-fit:cover;border-radius:6px;background:var(--surface-2);box-shadow:0 0 0 1px var(--line);transition:transform .18s,box-shadow .18s}
.card:hover .poster,.card:focus-visible .poster{transform:translateY(-4px);box-shadow:0 0 0 2px var(--accent),0 14px 28px -10px rgba(0,0,0,.5)}
.card:focus-visible{outline:none}
.card:hover .meta .t{color:var(--accent)}
.ph{display:grid;place-items:end start;padding:10px;background:linear-gradient(160deg,var(--surface-2),var(--line));font:800 13px/1.1 var(--display);text-transform:uppercase;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;min-width:0}
.meta .t{color:var(--fg);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{position:absolute;right:6px;top:6px;display:flex;gap:4px}
.badges span{background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 5px;border-radius:3px}

.loading{padding:60px 0;text-align:center;color:var(--muted)}
.empty{padding:32px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}
.err{padding:20px;border:1px solid var(--heart);border-radius:var(--r);color:var(--fg)}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select,.input{font:inherit;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px}
.input{width:100%}

/* film page */
.backdrop{position:relative;margin-top:-28px;height:clamp(180px,34vw,420px);background:var(--surface-2) center/cover no-repeat}
.backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,var(--bg) 100%)}
.film{display:grid;grid-template-columns:230px minmax(0,1fr) 260px;gap:32px;margin-top:-120px;position:relative;z-index:1}
.film .poster{box-shadow:0 10px 30px rgba(0,0,0,.4)}
.film h1 .yr{font-weight:500;color:var(--muted);font-size:.6em;margin-left:6px}
.facts{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.facts a{color:var(--fg);font-weight:600}
.facts a:hover{color:var(--accent)}
.overview{max-width:65ch;margin:0}
.tagline{font:500 13px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--fg)}
a.chip:hover{border-color:var(--accent)}
.side{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:14px;align-content:start}
.toggles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tog{background:var(--surface-2);border:1px solid transparent;border-radius:var(--r);padding:9px 4px;font-size:12px;font-weight:600;display:grid;gap:2px;justify-items:center}
.tog b{font-size:20px;line-height:1}
.tog.on.w{color:var(--accent);border-color:var(--accent)}
.tog.on.l{color:var(--heart);border-color:var(--heart)}
.tog.on.q{color:var(--star);border-color:var(--star)}
.rater{position:relative;display:inline-block;font-size:30px;line-height:1;letter-spacing:4px;user-select:none;color:var(--line);cursor:pointer;touch-action:none}
.rater .fill{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--star);pointer-events:none}
.community{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.community .big{font:800 34px/1 var(--display)}
.minihist{display:grid;grid-template-columns:repeat(10,8px);gap:2px;align-items:end;height:34px}
.minihist div{background:var(--star);border-radius:1px;min-height:2px;opacity:.85}
.providers{display:flex;gap:8px;flex-wrap:wrap}
.providers img{width:40px;height:40px;border-radius:8px}
.cast{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:960px){.film{grid-template-columns:180px minmax(0,1fr)}.side{grid-column:1/-1}}
@media (max-width:560px){.film{grid-template-columns:1fr;margin-top:-80px}.film>.pcol{width:150px}}

.person{display:grid;grid-template-columns:180px minmax(0,1fr);gap:28px}
.person .bio{max-width:65ch;margin:0;white-space:pre-line}
@media (max-width:560px){.person{grid-template-columns:1fr}.person>img{width:140px}}

.month{font:700 13px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);padding-top:14px}
.dline{display:grid;grid-template-columns:44px 38px minmax(0,1fr) auto auto 26px;gap:14px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.dline .day{font:700 22px/1 var(--display);text-align:center}
.dline .t{font-weight:600}
.dline .x{background:none;border:0;color:var(--muted);font-size:18px}
@media (max-width:560px){.dline{grid-template-columns:36px 34px minmax(0,1fr) auto 22px}.dline .rw{display:none}}

.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.stack{display:flex;min-height:84px}
.stack .poster{width:56px;margin-right:-18px;box-shadow:3px 0 8px rgba(0,0,0,.35)}
.list h3{font-size:18px} .list p{margin:0;color:var(--muted);font-size:13px}

.pbanner{position:relative;margin-top:-28px;height:clamp(170px,28vw,320px);background:linear-gradient(120deg,var(--accent),var(--heart)) center/cover no-repeat;border-radius:0 0 12px 12px}
.pbanner::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,transparent 35%,var(--bg) 100%)}
.pcredit{position:absolute;right:12px;top:10px;z-index:1;color:#fff;opacity:.75;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.phead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:end;margin-top:-96px;position:relative;z-index:1;padding-inline:8px}
.phead h1{font-size:clamp(30px,5vw,52px);overflow-wrap:anywhere}
.bigav{width:112px;height:112px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--heart));display:grid;place-items:center;font:800 46px var(--display);color:#fff;border:5px solid var(--bg);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:-16px}
.tile{background:var(--surface);padding:16px 18px;display:grid;gap:4px}
.tile b{font:700 28px/1 var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;margin-top:-16px}
.ptabs a{padding:10px 14px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.ptabs a.on{color:var(--fg);border-color:var(--accent)} .ptabs a:hover{color:var(--fg)}
.ptabs a .mono{font-size:12px;color:var(--muted);margin-left:2px}
.upd{display:grid;gap:4px;min-width:0}
.cstat{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px}
.tl{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding-block:9px;border-bottom:1px solid var(--line);font-size:14px}
.tl .poster{width:36px}
.tl .t{font-weight:600} .tl .t:hover{color:var(--accent)}
@media (max-width:760px){.tiles{grid-template-columns:repeat(3,1fr)}.tiles .tile:nth-child(n+4){display:none}.pcols{grid-template-columns:1fr}
  .phead{grid-template-columns:auto minmax(0,1fr);margin-top:-70px}.phead .filters{grid-column:1/-1}.bigav{width:84px;height:84px;font-size:34px}}
.ob{display:grid;gap:14px}
.ob-top{display:flex;justify-content:space-between;gap:10px;padding-right:28px}
.ob-bar{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.ob-bar div{height:100%;background:var(--accent);transition:width .3s}
.ob-film{width:min(220px,60%);justify-self:center}
.ob-film .poster{box-shadow:0 12px 30px rgba(0,0,0,.35)}
.ob-title{text-align:center;display:grid;gap:2px}
.ob-rate{display:grid;justify-items:center;gap:6px}
.ob-rate .rater{font-size:40px}
.ob-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ob-btns .btn{justify-content:center;font-size:13px;padding:10px 6px}
@media (max-width:480px){.ob-btns{grid-template-columns:1fr}}
.fav4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;max-width:620px}
.slot{aspect-ratio:2/3;border:1px dashed var(--line);border-radius:4px;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted);padding:8px}
.hist{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;align-items:end;height:110px;max-width:420px}
.hist div{background:var(--accent);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
.hist-l{display:flex;justify-content:space-between;max-width:420px;font-size:12px}
@media (max-width:560px){.prof{grid-template-columns:auto 1fr}.prof>.btn{grid-column:1/-1}}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:grid;place-items:start center;overflow-y:auto;
  padding-block:max(32px,env(safe-area-inset-top,0px)) 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--surface);border-radius:10px;width:min(560px,100%);display:grid;gap:14px;padding:24px;position:relative}
.sheet .close{position:absolute;right:12px;top:8px;background:none;border:0;font-size:24px;color:var(--muted)}
.sheet h2{color:var(--fg);font-size:22px;text-transform:none;letter-spacing:-.01em}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.field textarea{min-height:110px;resize:vertical;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:var(--r)}
.tabs button{flex:1;background:none;border:0;padding:8px;border-radius:4px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--fg)}
.formerr{color:var(--heart);font-size:13px;min-height:1em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:60}
footer{border-top:1px solid var(--line);padding-block:20px;font-size:12px;color:var(--muted)}
footer .wrap{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;align-items:center}
footer img{height:12px;vertical-align:middle}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap bar">
  <a class="logo" href="#/" aria-label="Scenelet home"><i><b></b><b></b><b></b></i>scenelet</a>
  <nav id="nav"></nav>
  <form class="search" id="searchform" role="search"><span class="muted">⌕</span><input id="q" type="search" placeholder="Search films and people" aria-label="Search"></form>
  <div class="who" id="who"></div>
</div></header>
<main class="wrap" id="main"></main>
<footer><div class="wrap">
  <span>Film data and posters from <a href="https://www.themoviedb.org" target="_blank" rel="noopener" style="color:var(--accent)">TMDB</a>. This product uses the TMDB API but is not endorsed or certified by TMDB. Streaming availability by JustWatch.</span>
  <a href="#/settings" class="link">Settings</a>
</div></footer>
<div id="modal"></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== Config =====
   Paste your free TMDB key here before deploying, so visitors don't have to.
   Get one at https://www.themoviedb.org/settings/api (API Key or Read Access Token both work). */
const TMDB_KEY = "acdf09e3b20c24acee330aae2c03076c";
const IMG = "https://image.tmdb.org/t/p/";
const REGION = "FR"; // country used for "Where to watch"
/* Shared accounts and ratings (Supabase). Leave empty to run in local mode (accounts in this browser only).

const cache=new Map();
function api(path,params={}){
  const u=new URL("https://api.themoviedb.org/3"+path);
  const p={language:"en-US",...params};
  for(const k in p) if(p[k]!==""&&p[k]!=null) u.searchParams.set(k,p[k]);
  const headers={accept:"application/json"};
  if(key.startsWith("eyJ")) headers.Authorization="Bearer "+key; else u.searchParams.set("api_key",key);
  const s=u.toString();
  if(cache.has(s)) return cache.get(s);
  const pr=fetch(s,{headers}).then(async r=>{
    if(r.status===401) throw new Error("TMDB refused the key. Check it in Settings.");
    if(!r.ok) throw new Error("TMDB returned an error ("+r.status+"). Try again in a moment.");
    return r.json();
  }).catch(e=>{cache.delete(s); if(e.name==="TypeError"||/fetch|network/i.test(e.message)) throw new Error("Couldn't reach TMDB. Check your connection. If you're viewing this inside a preview panel, download the file and open it in your browser instead."); throw e});
  cache.set(s,pr); return pr;
}

async function sha(s){
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  catch(e){let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return "f"+h.toString(16)}
}

async function allRatings(){
  if(sb){
    const {data,error}=await sb.from("ratings").select("user_id,film_id,rating,updated_at").limit(20000);
    if(error) throw error;
    return data.map(r=>({user:r.user_id,film:r.film_id,rating:+r.rating,at:Date.parse(r.updated_at)||0}));
  }
  const out=[];
  for(const u in users){
    const d=LS.get("scenelet.data."+u,{});
    for(const id in (d.ratings||{})){
      const a=(d.activity||[]).find(x=>x.t==="rated"&&x.film==id);
      out.push({user:u,film:+id,rating:d.ratings[id],at:a?a.at:0});
    }
  }
  return out;
}
async function community(){
  const rs=await allRatings(), by={}, weekAgo=Date.now()-7*864e5;
  for(const r of rs){ const f=by[r.film]||(by[r.film]={id:r.film,sum:0,n:0,week:0}); f.sum+=r.rating; f.n++; if(r.at>=weekAgo) f.week++ }
  const list=Object.values(by).map(f=>({...f,avg:f.sum/f.n}));
  const top=[...list].sort((a,b)=>b.avg-a.avg||b.n-a.n).slice(0,20);
  const popular=list.filter(f=>f.week).sort((a,b)=>b.week-a.week||b.avg-a.avg).slice(0,10);
  const need=[...new Set([...top,...popular].map(f=>f.id))];
  const films=Object.fromEntries((await Promise.all(need.map(id=>api("/movie/"+id).catch(()=>null)))).filter(Boolean).map(m=>[m.id,m]));
  const attach=arr=>arr.filter(f=>films[f.id]).map(f=>({...f,m:films[f.id]}));
  return {top:attach(top),popular:attach(popular),members:new Set(rs.map(r=>r.user)).size};
}

}

let tok=0;
async function route(){
  const parts=location.hash.replace(/^#\/?/,"").split("/");
  let view=parts[0]||"home"; const arg=decodeURIComponent(parts.slice(1).join("/"));
  if(!V[view]) view="home";

}

// Half-star widget: hover or arrows to preview, click or Enter to pick
function bindRater(r,cur,pick,lab,empty){
  if(!r) return;
  let kv=cur();
  const val=x=>{const b=r.getBoundingClientRect();return Math.min(5,Math.max(.5,Math.ceil((x-b.left)/b.width*10)/2))};
  const show=v=>{r.querySelector(".fill").style.width=v/5*100+"%"; if(lab) lab.textContent=v?v.toFixed(1)+" / 5":empty};
  r.onpointermove=e=>show(val(e.clientX)); r.onpointerleave=()=>show(cur());
  r.onclick=e=>pick(val(e.clientX));
  r.onkeydown=e=>{
    if(e.key==="Enter"&&kv){e.preventDefault();return pick(kv)}
    if(e.key==="ArrowRight"||e.key==="ArrowUp")kv=Math.min(5,kv+.5); else if(e.key==="ArrowLeft"||e.key==="ArrowDown")kv=Math.max(.5,kv-.5); else return;
    e.preventDefault(); show(kv);
  };
}
function attachRater(id){
  bindRater($("rater"),()=>S.ratings[id]||0,async v=>{ await rate(id,(S.ratings[id]||0)===v?0:v); save(); toast(S.ratings[id]?"Rated "+starTxt(S.ratings[id]):"Rating cleared"); refresh() },$("rv"),"Tap or slide to rate");
}

      <div class="rater" id="ob-rater" role="slider" tabindex="0" aria-label="Rating" aria-valuemin="0" aria-valuemax="5">★★★★★<div class="fill" style="width:0">★★★★★</div></div>
      <span class="mono muted" id="ob-rv" style="font-size:12px">Tap a star</span></div>
    <div class="ob-btns"><button class="btn ghost" data-act="ob-skip">Haven't seen it</button><button class="btn ghost" data-act="ob-seen">Seen it, no rating</button><button class="btn ghost" data-act="ob-want">Want to watch</button></div>
    <button class="link" data-act="ob-done" style="justify-self:center">${n?`Finish and see my profile`:"Skip for now"}</button></div>`);
  bindRater($("ob-rater"),()=>0,async v=>{ remember(m); OB.rated++; OB.i++; await rate(m.id,v); obRender() },$("ob-rv"),"Tap a star");
  const nx=OB.films[OB.i+1]; if(nx&&nx.poster_path) new Image().src=IMG+"w342"+nx.poster_path;
}
function obFinish(){
  const n=OB?OB.rated+OB.seen:0; OB=null; save(); closeModal();
  toast(n?`${n} film${n>1?"s":""} added to your profile`:"You can rate popular films anytime from your profile");
  if(n) location.hash="#/profile"; route();
}

/* ===== Modals ===== */
function modal(html){ $("modal").innerHTML=`<div class="scrim" data-act="close"><div class="sheet" role="dialog">${'<button class="close" data-act="close" aria-label="Close">×</button>'}${html}</div></div>`; const f=$("modal").querySelector("input,textarea"); if(f)f.focus() }
function closeModal(){ $("modal").innerHTML="" }
function authModal(tab){
  modal(`<div class="tabs"><button class="${tab==="in"?"on":""}" data-act="auth" data-tab="in">Sign in</button><button class="${tab==="up"?"on":""}" data-act="auth" data-tab="up">Create account</button></div>
  <form id="authform" data-tab="${tab}" style="display:grid;gap:12px">
    <h2>${tab==="up"?"Join Scenelet":"Welcome back"}</h2>
    ${tab==="up"?`<label class="field">Username<input class="input" id="a-user" autocomplete="username" maxlength="20" required><span>3 to 20 letters, numbers or underscores</span></label>
      <label class="field">Email<input class="input" id="a-email" type="email" autocomplete="email" required></label>`
    :`<label class="field">${sb?"Email":"Username or email"}<input class="input" id="a-user" ${sb?'type="email"':""} autocomplete="username" required></label>`}
    <label class="field">Password<input class="input" id="a-pass" type="password" autocomplete="${tab==="up"?"new-password":"current-password"}" required>${tab==="up"?"<span>At least 6 characters</span>":""}</label>
    <div class="formerr" id="a-err"></div>
    <button class="btn" type="submit">${tab==="up"?"Create account":"Sign in"}</button>
    ${sb?"":`<p class="muted" style="margin:0;font-size:12px">Local mode: accounts are stored in this browser.</p>`}</form>`);
}
async function submitAuth(form){
  const tab=form.dataset.tab, err=$("a-err"), btn=form.querySelector("button[type=submit]"), u=$("a-user").value.trim(), pw=$("a-pass").value;
  err.textContent=""; btn.disabled=true;
  try{
    if(tab==="up"){
      const name=u.toLowerCase(), email=$("a-email").value.trim().toLowerCase();
      if(!/^[a-z0-9_]{3,20}$/.test(name)) throw new Error("Use 3 to 20 letters, numbers or underscores for your username.");
      if(pw.length<6) throw new Error("Your password needs at least 6 characters.");
      const res=await signUp(name,email,pw);
      if(res==="confirm"){ form.innerHTML=`<h2>Check your inbox</h2><p style="margin:0">We sent a confirmation link to <b>${esc(email)}</b>. Open it, then come back and sign in.</p>`; return }
      toast("Welcome to Scenelet, "+me);
    }else{
      await signInWith(u,pw); toast("Signed in as "+me);
    }
    closeModal(); route();
    if(!S.onboarded && !S.watched.length) startOnboarding();
  }catch(x){ err.textContent=x.message||"Something went wrong. Try again." }
  finally{ btn.disabled=false }
}
function logModal(id){
  const f=S.films[id], r=S.ratings[id]||0;
  modal(`<h2>I watched…</h2><div style="display:grid;grid-template-columns:70px 1fr;gap:14px;align-items:center">${posterImg(f,"w154")}<div><b>${esc(f.title)}</b> <span class="muted mono">${esc(f.year)}</span></div></div>
  <form id="logform" data-film="${id}" style="display:grid;gap:12px">
    <div class="two"><label class="field">Date watched<input class="input" type="date" id="l-date" value="${today()}" max="${today()}" required></label>
      <label class="field">Rating<select id="l-rating"><option value="0">No rating</option>${[5,4.5,4,3.5,3,2.5,2,1.5,1,.5].map(v=>`<option value="${v}" ${v===r?"selected":""}>${starTxt(v)} (${v})</option>`).join("")}</select></label></div>
    <label class="field">Review<textarea id="l-review" placeholder="Add a review…"></textarea></label>
    <div class="filters"><label><input type="checkbox" id="l-like" ${S.likes.includes(id)?"checked":""}> Like</label>
      <label><input type="checkbox" id="l-rw" ${S.logs.some(l=>l.film===id)||S.watched.includes(id)?"checked":""}> I've watched this before</label></div>
    <button class="btn" type="submit">Save to diary</button></form>`);
}
function newListModal(addId){
  modal(`<h2>New list</h2><form id="listform" data-add="${addId||""}" style="display:grid;gap:12px">
    <label class="field">Name<input class="input" id="ln" maxlength="80" required></label>
    <label class="field">Description<textarea id="ld" maxlength="500" style="min-height:70px"></textarea></label>
    <button class="btn" type="submit">Create list</button></form>`);
}

/* ===== Events ===== */
let armed=null;
function confirmTwice(el,label){ if(armed===el)return true; armed=el; el.textContent=label; el.classList.add("danger"); return false }
const toggle=(arr,id)=>{const i=arr.indexOf(id); if(i>=0){arr.splice(i,1);return false} arr.push(id); return true};

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const a=t.dataset.act, fid=+(document.querySelector("[data-film]")||{}).dataset?.film;
  if(a==="close"){ if(e.target===t){ if(OB) return obFinish(); closeModal() } return }
  if(a==="auth"){ e.preventDefault(); return authModal(t.dataset.tab) }
  if(a==="logout"){ await signOut(); location.hash="#/"; route(); return toast("Signed out") }
  if(a==="savekey"){
    const k=$("tmdbkey").value.trim(), err=$("keyerr"); if(!k) return err.textContent="Paste your key first.";
    const old=key; key=k; cache.clear();
    try{ await api("/configuration"); LS.set("scenelet.tmdb",key); toast("Connected to TMDB"); location.hash="#/"; route() }
    catch(x){ key=old; err.textContent=x.message }
    return;
  }
  if(a==="more"){
    t.disabled=true; browse.page++;
    try{ const d=await discover(); $("fgrid").insertAdjacentHTML("beforeend",d.results.map(card).join("")); t.hidden=browse.page>=browse.total }catch(x){ toast(x.message) }
    t.disabled=false; return;
  }
  if(a==="genre"){ e.preventDefault(); browse={...browse,genre:t.dataset.genre,decade:"",country:""}; location.hash="#/films"; return }
  if(!me) return;
  if(a==="onboard") return startOnboarding();
  if(OB&&a.startsWith("ob-")){
    const m=OB.films[OB.i];
    if(a==="ob-done") return obFinish();
    if(a==="ob-seen"){ remember(m); if(!S.watched.includes(m.id)){S.watched.push(m.id); act("watched",m.id)} OB.seen++; save() }
    if(a==="ob-want"){ remember(m); if(!S.watchlist.includes(m.id)){S.watchlist.push(m.id); act("watchlist",m.id)} save() }
    OB.i++; return obRender();
  }
  if(a==="watched"){ if(!toggle(S.watched,fid)){ if(S.ratings[fid]) await rate(fid,0) } else { S.watchlist=S.watchlist.filter(x=>x!==fid); act("watched",fid) } save(); return refresh() }
  if(a==="like"){ const on=toggle(S.likes,fid); if(on){ act("liked",fid); if(!S.watched.includes(fid))S.watched.push(fid) } save(); return refresh() }
  if(a==="watchlist"){ const on=toggle(S.watchlist,fid); if(on) act("watchlist",fid); save(); toast(on?"Added to watchlist":"Removed from watchlist"); return refresh() }
  if(a==="fav"){ if(!S.favs.includes(fid)&&S.favs.length>=4) return toast("Your favourite four is full. Remove one first."); if(toggle(S.favs,fid)) act("fav",fid); save(); return refresh() }
  if(a==="log") return logModal(fid);
  if(a==="pick"){ const f=S.films[S.watchlist[Math.floor(Math.random()*S.watchlist.length)]]; $("picked").innerHTML=`Tonight: <a href="#/film/${f.id}" style="color:var(--fg);font-weight:600">${esc(f.title)}</a>${f.runtime?` · ${f.runtime} min`:""}`; return }
  if(a==="dellog"){ S.logs=S.logs.filter(l=>l.id!=t.dataset.id); save(); toast("Entry deleted"); return refresh() }
  if(a==="newlist") return newListModal();
  if(a==="rmfromlist"){ const L=S.lists.find(x=>x.id==t.dataset.list); L.films=L.films.filter(x=>x!=t.dataset.id); save(); return refresh() }
  if(a==="dellist"){ if(!confirmTwice(t,"Press again to delete")) return; S.lists=S.lists.filter(x=>x.id!=t.dataset.id); save(); toast("List deleted"); location.hash="#/lists"; return }
  if(a==="delacct"){
    if(!confirmTwice(t,"Press again to erase everything")) return;
    if(sb){ await sb.from("ratings").delete().eq("user_id",uid); await sb.from("user_data").upsert({id:uid,data:{}}) }
    else { LS.del("scenelet.data."+me); delete users[me]; LS.set("scenelet.users",users) }
    await signOut(); toast(sb?"Your data was erased":"Account deleted"); location.hash="#/"; return route();
  }
});
document.addEventListener("submit",async e=>{
  e.preventDefault(); const f=e.target;
  if(f.id==="searchform"){ const q=$("q").value.trim(); if(q) location.hash="#/search/"+encodeURIComponent(q); return }
  if(f.id==="authform") return submitAuth(f);
  if(f.id==="logform"){
    const id=+f.dataset.film, rating=+$("l-rating").value, liked=$("l-like").checked;
    S.logs.push({id:S.nextId++,film:id,date:$("l-date").value||today(),rating,liked,review:$("l-review").value.trim(),rewatch:$("l-rw").checked});
    if(rating) await rate(id,rating,true);
    act($("l-review").value.trim()?"reviewed":"logged",id,rating||0);
    if(liked&&!S.likes.includes(id)) S.likes.push(id); if(!liked) S.likes=S.likes.filter(x=>x!==id);
    if(!S.watched.includes(id)) S.watched.push(id); S.watchlist=S.watchlist.filter(x=>x!==id);
    save(); closeModal(); toast("Saved to your diary"); return refresh();
  }
  if(f.id==="listform"){
    const name=$("ln").value.trim(); if(!name) return;
    const L={id:S.nextId++,name,desc:$("ld").value.trim(),films:[]}; if(f.dataset.add) L.films.push(+f.dataset.add);
    S.lists.unshift(L); save(); closeModal(); toast(f.dataset.add?"List created with this film":"List created"); return refresh();
  }
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="addlist"&&t.value){
    const fid=+document.querySelector("[data-film]").dataset.film;
    if(t.value==="new") return newListModal(fid);
    const L=S.lists.find(x=>x.id==t.value), on=toggle(L.films,fid); if(on) act("listed",fid,L.name); save(); toast((on?"Added to ":"Removed from ")+L.name); return refresh();
  }
  if(t.id==="p-filter"){ pf.filter=t.value; return refresh() }
  if(t.id==="p-sort"){ pf.sort=t.value; return refresh() }
  const map={"f-genre":"genre","f-decade":"decade","f-country":"country","f-sort":"sort"};
  if(map[t.id]){ browse[map[t.id]]=t.value; refresh() }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal() });
window.addEventListener("hashchange",()=>{ closeModal(); armed=null; route() });
if(sb) sb.auth.onAuthStateChange((ev,session)=>{ if(ev==="SIGNED_IN"&&session&&!me) openSession(session.user).then(route) });
restore().catch(()=>{}).then(route);
</script>
</body>
